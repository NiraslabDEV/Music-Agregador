name: Build desktop apps

on:
  push:
    branches: [main]
    paths-ignore:
      - "api/**"
      - "**.md"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BUILD_VERSION: "1.0.${{ github.run_number }}"
  PROJECT_NAME: "Music Aggregator"
  ORG_NAME: "com.niraslab.musicaggregator"
  APP_DESCRIPTION: "Preco em cada loja + a melhor opcao gratis"
  PYTHONUTF8: "1"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"

      - name: Instalar dependencias
        run: pip install -r requirements-desktop.txt

      - name: Compilar app macOS
        run: >
          flet build macos
          --project "$PROJECT_NAME"
          --product "$PROJECT_NAME"
          --org "$ORG_NAME"
          --description "$APP_DESCRIPTION"
          --build-version "$BUILD_VERSION"

      - name: Empacotar em .dmg
        run: |
          mkdir -p dist
          APP_PATH=$(find build/macos -maxdepth 1 -name "*.app" | head -n 1)
          hdiutil create -volname "Music Aggregator" -srcfolder "$APP_PATH" -ov -format UDZO "dist/MusicAggregator-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/MusicAggregator-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"

      - name: Instalar dependencias
        run: pip install -r requirements-desktop.txt

      - name: Compilar app Windows
        shell: pwsh
        run: >
          flet build windows
          --project "$env:PROJECT_NAME"
          --product "$env:PROJECT_NAME"
          --org "$env:ORG_NAME"
          --description "$env:APP_DESCRIPTION"
          --build-version "$env:BUILD_VERSION"

      - name: Empacotar em .zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/*" -DestinationPath "dist/MusicAggregator-Windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/MusicAggregator-Windows.zip

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist

      - name: Publicar/atualizar release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/MusicAggregator-macOS.dmg dist/MusicAggregator-Windows.zip \
            --title "Music Aggregator - build mais recente" \
            --notes "Build automatico a partir do commit ${{ github.sha }}. Este release e sempre substituido pelo build mais novo - os links de download nunca mudam." \
            --target "${{ github.sha }}"
